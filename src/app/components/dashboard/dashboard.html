<div class="dashboard-wrapper">

 <header class="dashboard-header">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
    </div>
    <div>
      <h1>Aviation Operations Dashboard</h1>
      <p class="subtitle">Live monitoring of active, delayed, and completed flights</p>
    </div>
  </div>

  <div class="header-actions">
    <span class="live-pill"><span class="live-dot"></span>Live</span>

    <button type="button" class="theme-switch" role="switch"
            [attr.aria-checked]="isDarkMode" (click)="toggleDarkMode()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <span class="switch-label">{{ isDarkMode ? 'Dark' : 'Light' }} mode</span>
      <span class="switch-track" [class.on]="isDarkMode"><span class="switch-thumb"></span></span>
    </button>
  </div>
</header>

  <app-filter-bar
    [originOptions]="originOptions"
    [destinationOptions]="destinationOptions"
    (filtersChanged)="onFiltersChanged($event)">
  </app-filter-bar>

  <app-kpi-cards
    [total]="counts.total"
    [active]="counts.active"
    [delayed]="counts.delayed"
    [arrived]="counts.arrived">
  </app-kpi-cards>

  <div class="main-content">

    <div class="map-section">
      <app-flight-map
        [flights]="filteredFlights"
        [selectedFlight]="selectedFlight"
        (flightSelected)="onFlightSelected($event)">
      </app-flight-map>
    </div>

    <div class="details-section">
      <app-flight-details [flight]="selectedFlight"></app-flight-details>
    </div>

  </div>

</div>
